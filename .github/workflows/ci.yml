name: nf-core CI
# This workflow runs the pipeline with the minimal test dataset to check that it completes without any syntax errors
on:
  push:
    branches:
      - dev
  pull_request:
  release:
    types: [published]

env:
  NXF_ANSI_LOG: false

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Run pipeline with test data
    # Only run on push if this is the nf-core dev branch (merged PRs)
    if: "${{ github.event_name != 'push' || (github.event_name == 'push' && github.repository == 'sage/dcqc') }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        NXF_VER:
          - "25.04.6" # Current version used by Sage's Seqera server
          - "25.10.0" # Oldest version that works (nf-schema 2.7.2 needs >=25.10.0)
          - "25.10.2"
          - "26.04.0"
          - "latest-everything"
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v7.0.1

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@c66f1bfa2dc817ae23f4b34eaa26fa5f1453ca71 # v3.1.0
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Run pipeline with test data
        env:
          SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
        run: |
          nextflow secrets set SYNAPSE_AUTH_TOKEN "${SYNAPSE_AUTH_TOKEN}"
          nextflow run ${GITHUB_WORKSPACE} -profile test,docker --outdir ./results
