name: nf-core linting
# This workflow is triggered on pushes and PRs to the repository.
# It runs the `nf-core lint` and markdown lint tests to ensure
# that the code meets the nf-core guidelines.
on:
  push:
    branches:
      - dev
  pull_request:
  release:
    types: [published]

jobs:
  EditorConfig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0

      - name: Install editorconfig-checker
        run: npm install -g editorconfig-checker

      - name: Run ECLint check
        run: editorconfig-checker -exclude README.md $(find .* -type f | grep -v '.git\|.py\|.md\|json\|yml\|yaml\|html\|css\|work\|.nextflow\|build\|nf_core.egg-info\|log.txt\|Makefile')

  Prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0

      - name: Install Prettier
        run: npm install -g prettier

      - name: Run Prettier --check
        run: prettier --check ${GITHUB_WORKSPACE}

  PythonBlack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check code lints with Black
        uses: psf/black@87928e6d6761a4a6d22250e1fee5601b3998086e # 26.5.1

      # If the above check failed, post a comment on the PR explaining the failure
      - name: Post PR comment
        if: failure()
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message: |
            ## Python linting (`black`) is failing

            To keep the code consistent with lots of contributors, we run automated code consistency checks.
            To fix this CI test, please run:

            * Install [`black`](https://black.readthedocs.io/en/stable/): `pip install black`
            * Fix formatting errors in your pipeline: `black .`

            Once you push these changes the test should pass, and you can hide this comment :+1:

            We highly recommend setting up Black in your code editor so that this formatting is done automatically on save. Ask about it on Slack for help!

            Thanks again for your contribution!
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allow-repeats: false

  # Disabled: `nf-core pipelines lint` fails unconditionally on this repo.
  # nextflow_schema.json must stay on JSON Schema draft-07/`definitions`
  # because lib/NfcoreSchema.groovy (the legacy validator this repo actually
  # runs) only supports that draft - switching to draft 2020-12/`$defs` to
  # satisfy the linter breaks every pipeline run at startup (see CLAUDE.md
  # "Anti-Patterns", PR #24, Jira DPE-1808). Several individual lint checks
  # (schema_lint, schema_params, schema_description, ...) all load the schema
  # and assert its draft; most don't catch the resulting AssertionError, so
  # skipping them one at a time via .nf-core.yml `lint:` overrides (tried in
  # reverted commits on this branch) just moves the uncaught critical error to
  # the next schema-touching check instead of fixing it. Re-enable this job
  # only once the draft-07/2020-12 incompatibility above is actually resolved.

